name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-test:
    name: Engine (headless PC render test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless engine
        run: make -C platform/headless deadbird_headless gaittest stresstest labview CFLAGS="-O2 -std=c99 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Play the test level headless (scripted input)
        run: |
          mkdir -p frames
          ./platform/headless/deadbird_headless frames
          ./platform/headless/gaittest frames/gait_walk_run.bmp
          ./platform/headless/stresstest
          ./platform/headless/labview frames
      - uses: actions/upload-artifact@v4
        with:
          name: test-frames
          path: frames/*.bmp

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p platform/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Deadbird-debug-apk
          path: platform/android/app/build/outputs/apk/debug/*.apk

  windows:
    name: Windows EXE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build Deadbird.exe
        run: make -C platform/windows CC=x86_64-w64-mingw32-gcc CFLAGS="-O2 -std=c99 -Wall -Wextra -Wno-unused-parameter -Werror"
      - uses: actions/upload-artifact@v4
        with:
          name: Deadbird-windows
          path: platform/windows/Deadbird.exe
