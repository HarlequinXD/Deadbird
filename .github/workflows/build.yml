name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-test:
    name: Engine (headless PC render test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless engine
        run: make -C platform/headless deadbird_headless gaittest stresstest labview combattest vistest edtest edittest hello_headless fps_headless fwtest CFLAGS="-O2 -std=c99 -Wall -Wextra -Wno-unused-parameter -Werror"
      - name: Play the test level headless (scripted input)
        run: |
          mkdir -p frames
          ./platform/headless/deadbird_headless frames
          ./platform/headless/gaittest frames/gait_walk_run.bmp
          ./platform/headless/stresstest
          MAP=test ./platform/headless/stresstest
          ./platform/headless/combattest
          ./platform/headless/labview frames
          ./platform/headless/vistest frames
          (cd platform/headless && ./edtest)
          ./platform/headless/edittest frames
          DOORTEST=1 ./platform/headless/labview frames
      - name: The engine's sample game on the generic headless runner
        run: |
          printf 'hold 30\nshot hello_1\nhold 20 LEFT UP\ntap CROSS\nshot hello_2\ntouch down 1 60 150\ntouch move 1 100 120\nhold 10\ntouch up 1 100 120\nshot hello_3\n' > hello.txt
          WIDE=426 TOUCH=1 ./platform/headless/hello_headless frames hello.txt
      - name: The gameplay framework (state machines, actions, combat) on the sample FPS
        run: |
          ./platform/headless/fwtest frames
          printf 'hold 30\nshot fps_start\nstick 0 4096\nhold 120\nshot fps_walk\n' > fps.txt
          WIDE=426 TOUCH=1 ./platform/headless/fps_headless frames fps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-frames
          path: frames/*.bmp

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: |
          gradle -p platform/android assembleDebug --stacktrace
          ls -la platform/android/app/build/outputs/apk/debug/
          find platform/android/app/build -name libdeadbird.so -path '*stripped*' -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: Deadbird-debug-apk
          path: platform/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HellGate-debug-apk
          path: platform/android/hellgate/build/outputs/apk/debug/*.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Visual C++ build: MSVC executables with version info + manifest + icon are far less
      # likely to be flagged by antivirus heuristics than bare MinGW static builds
      - name: Build Deadbird.exe (MSVC)
        shell: cmd
        working-directory: platform/windows
        run: build_msvc.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Deadbird-windows
          path: platform/windows/Deadbird.exe

  windows-mingw:
    name: Windows EXE (MinGW check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build Deadbird.exe
        run: |
          make -C platform/windows CC=x86_64-w64-mingw32-gcc CFLAGS="-Os -std=c99 -Wall -Wextra -Wno-unused-parameter -Werror"
          ls -la platform/windows/Deadbird.exe

  ps1:
    name: PS1 disc image
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PSn00bSDK (prebuilt release + GCC mipsel toolchain)
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ninja-build unzip
          mkdir dl && gh release download -R Lameguy64/PSn00bSDK -p '*.zip' -D dl
          ls -la dl
          for z in dl/*.zip; do
            case "$z" in
              *gcc*linux*)   sudo mkdir -p /opt/mipsel-none-elf && sudo unzip -q -o "$z" -d /opt/mipsel-none-elf ;;
              *gcc*)         ;;
              *[Ll]inux*)    sudo mkdir -p /opt/psn00bsdk && sudo unzip -q -o "$z" -d /opt/psn00bsdk ;;
            esac
          done
          SDKCMAKE=$(find /opt/psn00bsdk -name sdk.cmake -path '*libpsn00b/cmake/*' | head -1)
          echo "sdk.cmake: $SDKCMAKE"
          echo "PSN00BSDK_LIBS=$(dirname $(dirname $SDKCMAKE))" >> $GITHUB_ENV
          for b in $(find /opt/psn00bsdk /opt/mipsel-none-elf -type d -name bin); do echo "$b" >> $GITHUB_PATH; done
      - name: Build DEADBIRD.EXE and the CD image
        run: |
          mipsel-none-elf-gcc --version | head -1
          cmake --preset default -S platform/psx
          cmake --build platform/psx/build
          ls -la platform/psx/build
          mipsel-none-elf-size platform/psx/build/deadbird.elf
      - uses: actions/upload-artifact@v4
        with:
          name: Deadbird-ps1
          path: |
            platform/psx/build/deadbird.exe
            platform/psx/build/deadbird.bin
            platform/psx/build/deadbird.cue
