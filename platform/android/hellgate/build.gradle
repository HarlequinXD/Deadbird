plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harlequinxd.hellgate'
    compileSdk 35

    defaultConfig {
        applicationId 'com.harlequinxd.hellgate'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'          // 64-bit phones only: half the APK
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }       // store the native library compressed in the APK
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
